
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Karwar Bus Search - Find Your Bus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    /* ── SEARCH CONTAINER ── */
    .search-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .search-card {
      background: white;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,.15);
    }

    .search-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 20px;
      text-align: center;
    }

    /* FROM-TO INPUTS */
    .route-input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.3rem;
      z-index: 1;
    }

    .route-input {
      width: 100%;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: all .2s;
      background: white;
    }

    .route-input:focus {
      border-color: #e8440a;
      box-shadow: 0 0 0 3px rgba(232,68,10,.1);
    }

    .swap-btn {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: #e8440a;
      color: white;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(232,68,10,.3);
      transition: transform .2s;
      z-index: 2;
    }

    .swap-btn:hover {
      transform: translateY(-50%) rotate(180deg);
    }

    .search-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e8440a, #ff6b35);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      box-shadow: 0 4px 14px rgba(232,68,10,.3);
      transition: transform .2s;
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(232,68,10,.4);
    }

    /* SUGGESTIONS DROPDOWN */
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 2px solid #e8440a;
      border-top: none;
      border-radius: 0 0 12px 12px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 10;
      display: none;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }

    .suggestion-item {
      padding: 12px 14px;
      cursor: pointer;
      transition: background .15s;
      font-size: .95rem;
    }

    .suggestion-item:hover {
      background: #fff3ef;
    }

    .suggestion-item:last-child {
      border-radius: 0 0 10px 10px;
    }

    /* QUICK ROUTES */
    .quick-routes {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .quick-routes-title {
      font-size: .9rem;
      color: #666;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .quick-route-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .quick-chip {
      padding: 8px 14px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: .85rem;
      cursor: pointer;
      transition: all .2s;
    }

    .quick-chip:hover {
      background: #e8440a;
      color: white;
      border-color: #e8440a;
    }

    /* RESULTS PAGE */
    .results-container {
      display: none;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    .back-btn {
      background: rgba(255,255,255,.9);
      border: none;
      padding: 10px 16px;
      border-radius: 25px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    .results-header {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    .route-display {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .route-arrow {
      color: #e8440a;
      font-size: 1.3rem;
    }

    .results-count {
      font-size: .85rem;
      color: #666;
    }

    /* BUS RESULT CARDS */
    .bus-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      transition: transform .2s, box-shadow .2s;
    }

    .bus-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(232,68,10,.2);
    }

    .bus-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .bus-route-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }

    .bus-type-badge {
      background: #e8440a;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: .75rem;
      font-weight: 600;
    }

    .bus-timings {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .time-badge {
      background: #fff3ef;
      border: 1px solid #f5c4b0;
      color: #c73209;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: .85rem;
      font-weight: 600;
    }

    .no-results {
      background: white;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    .no-results-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .no-results-text {
      color: #666;
      font-size: 1rem;
    }

    /* RESPONSIVE */
    @media(max-width: 480px) {
      .search-card {
        padding: 20px 16px;
      }
      .search-title {
        font-size: 1.2rem;
      }
      .route-input {
        font-size: .95rem;
      }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!-- SEARCH PAGE -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<div class="search-container" id="searchPage">
  <div class="search-card">
    <h2 class="search-title">Find Your Bus</h2>

    <form id="searchForm" onsubmit="searchBuses(event)">
      <div class="route-input-group">
        <!-- FROM INPUT (STATIC - KARWAR ONLY) -->
        <div class="input-wrapper">
          <input
            type="text"
            id="fromInput"
            class="route-input"
            value="Karwar"
            readonly
            style="background: #f5f5f5; cursor: not-allowed;"
          />
        </div>

        <!-- TO INPUT -->
        <div class="input-wrapper">
          <input
            type="text"
            id="toInput"
            class="route-input"
            placeholder="To (e.g., Ankola, Goa)"
            autocomplete="off"
            required
            oninput="showSuggestions('to')"
            onfocus="showSuggestions('to')"
          />
          <div id="toSuggestions" class="suggestions"></div>
        </div>
      </div>

      <button type="submit" class="search-btn">🔍 Search Buses</button>
    </form>

    <!-- QUICK ROUTES -->
    <div class="quick-routes">
      <div class="quick-routes-title">🚀 Popular Routes</div>
      <div class="quick-route-chips">
        <div class="quick-chip" onclick="quickSearch('Karwar', 'Ankola')">Karwar → Ankola</div>
        <div class="quick-chip" onclick="quickSearch('Karwar', 'Goa')">Karwar → Goa</div>
        <div class="quick-chip" onclick="quickSearch('Karwar', 'Hubli')">Karwar → Hubli</div>
        <div class="quick-chip" onclick="quickSearch('Karwar', 'Bangalore')">Karwar → Bangalore</div>
        <div class="quick-chip" onclick="quickSearch('Karwar', 'Mangalore')">Karwar → Mangalore</div>
        <div class="quick-chip" onclick="quickSearch('Karwar', 'Mudaga')">Karwar → Mudaga</div>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!-- RESULTS PAGE -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<div class="results-container" id="resultsPage">
  <button class="back-btn" onclick="goBack()">← Back to Search</button>

  <div class="results-header">
    <div class="route-display">
      <span id="displayFrom">Karwar</span>
      <span class="route-arrow">→</span>
      <span id="displayTo">Ankola</span>
    </div>
    <div class="results-count" id="resultsCount">0 buses found</div>
  </div>

  <div id="busResults"></div>
</div>

<script>
  // ── BUS DATA (from bus-timings.html) ───────────────────────────────────────
  const busData = [
    // LONG DISTANCE
    { from: "Karwar", to: "Ankola", type: "KSRTC", times: ["06:00","07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00"] },
    { from: "Karwar", to: "Kumta", type: "KSRTC", times: ["06:30","08:00","09:30","11:00","12:30","14:00","15:30","17:00","18:30"] },
    { from: "Karwar", to: "Hubli", type: "KSRTC", times: ["06:00","07:30","09:00","11:00","13:00","15:00","17:00"] },
    { from: "Karwar", to: "Goa", type: "KSRTC", times: ["06:00","07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00"] },
    { from: "Karwar", to: "Panaji", type: "KSRTC", times: ["06:00","07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00"] },
    { from: "Karwar", to: "Bangalore", type: "KSRTC", times: ["19:00","19:30","20:00","20:30","21:00"] },
    { from: "Karwar", to: "Mangalore", type: "KSRTC", times: ["06:00","08:00","10:00","12:00","14:00","16:00","18:00"] },
    { from: "Karwar", to: "Sirsi", type: "KSRTC", times: ["07:00","09:00","11:00","13:00","15:00","17:00"] },
    { from: "Karwar", to: "Dandeli", type: "KSRTC", times: ["07:30","10:00","12:30","15:00","17:30"] },
    
    // LOCAL
    { from: "Karwar", to: "Mudaga", type: "Local", times: ["07:00","07:45","08:30","09:15","10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:20","15:45","16:30","17:00","18:00","18:30","19:30","20:30"] },
    { from: "Karwar", to: "Kadawada", type: "Local", times: ["06:30","07:20","08:30","09:00","09:30","10:15","10:45","11:45","12:30","13:00","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:30","19:00","19:45","20:30","21:30"] },
    { from: "Karwar", to: "Devabaga", type: "Local", times: ["07:00","08:30","10:00","11:30","12:30","14:00","15:15","17:00","18:30","19:30","21:15"] },
    { from: "Karwar", to: "Mudageri", type: "Local", times: ["06:40","07:20","08:45","10:30","11:45","12:30","14:10","16:15","17:15","18:45"] },
    { from: "Karwar", to: "Majali Mudageri", type: "Local", times: ["08:00","09:30","11:15","13:30","15:00","18:00","19:45","20:30","21:30"] },
    { from: "Karwar", to: "Ulaga", type: "Local", times: ["07:30","13:30","15:30","16:30","19:30"] },
    { from: "Karwar", to: "Todur", type: "Local", times: ["09:00","10:45","13:00","14:30","18:00","21:00"] },
    { from: "Karwar", to: "Mallapur", type: "Local", times: ["05:50","07:45","08:45","09:45","10:45","11:45","12:45","13:45","15:45","17:15","19:15","19:45"] },
    { from: "Karwar", to: "Siddha ITI", type: "Local", times: ["06:15","08:00","09:00","10:00","12:00","13:45","14:30","16:30","17:20"] },
    { from: "Karwar", to: "Majali", type: "Local", times: ["06:50","07:30","08:20","08:45","10:15","10:45","12:00","13:00","14:00","15:15","15:45","16:15","17:15"] },
    { from: "Karwar", to: "Halaga", type: "Local", times: ["06:30","08:45","11:30","14:00","14:15","16:15"] },
    { from: "Karwar", to: "Chitakula", type: "Local", times: ["08:00","10:30","11:00","16:30"] },
    { from: "Karwar", to: "Gajitawada", type: "Local", times: ["07:00","08:20","09:45","10:30","11:45","13:45","17:30"] },
    { from: "Karwar", to: "Toraibaga", type: "Local", times: ["07:45","17:45"] },
    { from: "Karwar", to: "Shivaji College", type: "Local", times: ["09:40","16:20"] },
    { from: "Karwar", to: "Shirva", type: "Local", times: ["07:15","15:00"] },
    { from: "Karwar", to: "Goyas", type: "Local", times: ["07:30","15:30"] },
    { from: "Karwar", to: "Ramnath Kothara", type: "Local", times: ["07:00","14:00","17:00"] }
  ];

  // Extract unique locations for suggestions
  const allLocations = [...new Set(busData.flatMap(b => [b.from, b.to]))].sort();

  // ── SHOW SUGGESTIONS ───────────────────────────────────────────────────────
  function showSuggestions(type) {
    const input = document.getElementById(type + 'Input');
    const suggestionsDiv = document.getElementById(type + 'Suggestions');
    const query = input.value.toLowerCase().trim();

    if (!query) {
      suggestionsDiv.style.display = 'none';
      return;
    }

    const filtered = allLocations.filter(loc => loc.toLowerCase().includes(query));

    if (filtered.length === 0) {
      suggestionsDiv.style.display = 'none';
      return;
    }

    suggestionsDiv.innerHTML = filtered.map(loc => 
      `<div class="suggestion-item" onclick="selectLocation('${type}', '${loc}')">${loc}</div>`
    ).join('');

    suggestionsDiv.style.display = 'block';
  }

  // ── SELECT LOCATION ────────────────────────────────────────────────────────
  function selectLocation(type, location) {
    document.getElementById(type + 'Input').value = location;
    document.getElementById(type + 'Suggestions').style.display = 'none';
  }

  // ── QUICK SEARCH ───────────────────────────────────────────────────────────
  function quickSearch(from, to) {
    // From is always Karwar, so we only set the TO field
    document.getElementById('toInput').value = to;
    document.getElementById('searchForm').dispatchEvent(new Event('submit'));
  }

  // ── SEARCH BUSES ───────────────────────────────────────────────────────────
  function searchBuses(event) {
    event.preventDefault();

    const from = document.getElementById('fromInput').value.trim();
    const to = document.getElementById('toInput').value.trim();

    // Find matching buses
    const results = busData.filter(bus => 
      bus.from.toLowerCase().includes(from.toLowerCase()) &&
      bus.to.toLowerCase().includes(to.toLowerCase())
    );

    // Update display
    document.getElementById('displayFrom').textContent = from;
    document.getElementById('displayTo').textContent = to;
    document.getElementById('resultsCount').textContent = `${results.length} ${results.length === 1 ? 'bus' : 'buses'} found`;

    // Render results
    renderResults(results);

    // Show results page
    document.getElementById('searchPage').style.display = 'none';
    document.getElementById('resultsPage').style.display = 'block';

    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── RENDER RESULTS ─────────────────────────────────────────────────────────
  function renderResults(results) {
    const container = document.getElementById('busResults');

    if (results.length === 0) {
      container.innerHTML = `
        <div class="no-results">
          <div class="no-results-icon">😔</div>
          <div class="no-results-text">No buses found for this route.<br>Try a different search.</div>
        </div>
      `;
      return;
    }

    container.innerHTML = results.map(bus => {
      const timingsHTML = bus.times.map(time => {
        const [h, m] = time.split(':').map(Number);
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 || 12;
        const formatted = `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
        return `<span class="time-badge">${formatted}</span>`;
      }).join('');

      return `
        <div class="bus-card">
          <div class="bus-card-header">
            <div>
              <div class="bus-route-name">${bus.from} → ${bus.to}</div>
              <div style="font-size: .85rem; color: #666;">${bus.times.length} trips available</div>
            </div>
            <div class="bus-type-badge">${bus.type}</div>
          </div>
          <div class="bus-timings">${timingsHTML}</div>
        </div>
      `;
    }).join('');
  }

  // ── GO BACK ────────────────────────────────────────────────────────────────
  function goBack() {
    document.getElementById('searchPage').style.display = 'block';
    document.getElementById('resultsPage').style.display = 'none';
  }

  // ── HIDE SUGGESTIONS ON OUTSIDE CLICK ─────────────────────────────────────
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.input-wrapper')) {
      document.getElementById('toSuggestions').style.display = 'none';
    }
  });
</script>
</body>
</html>
