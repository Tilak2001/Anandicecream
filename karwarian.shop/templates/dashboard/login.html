{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Karwarian Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f1117;
            color: #e4e6f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #1a1d27;
            border: 1px solid #2d3148;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .login-box .icon {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.5rem; color: #fff;
        }
        .login-box h1 { font-size: 1.4rem; margin-bottom: 5px; }
        .login-box p { font-size: 0.85rem; color: #8b8fa8; margin-bottom: 30px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; color: #8b8fa8; margin-bottom: 6px; font-weight: 600; }
        .form-group input {
            width: 100%; padding: 12px 16px;
            background: #232736; border: 1px solid #2d3148;
            border-radius: 10px; color: #e4e6f0;
            font-family: 'Poppins', sans-serif; font-size: 0.95rem;
            outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #6366f1; }
        .error { background: rgba(239,68,68,0.1); color: #ef4444; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; }
        .btn-login {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            color: #fff; border: none; border-radius: 10px;
            font-family: 'Poppins', sans-serif; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(99,102,241,0.3); }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="icon"><i class="fas fa-ship"></i></div>
        <h1>Karwarian Admin</h1>
        <p>Sign in to manage your portal</p>
        
        {% if error %}
        <div class="error"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
    </div>
</body>
</html>
