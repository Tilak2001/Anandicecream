{% extends 'dashboard/base.html' %}
{% block title %}{{ action }} Match{% endblock %}
{% block nav_cricket_add %}{% if action == 'Add' %}active{% endif %}{% endblock %}

{% block content %}
<div class="topbar">
    <h1>🏏 {{ action }} Cricket Match</h1>
    <a href="{% url 'cricket_list' %}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
</div>

<div class="panel">
    <div class="panel-body">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Series / Tournament Name</label>
                <input type="text" name="series_name" class="form-control" value="{{ match.series_name|default:'Karwar District League' }}" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Team 1</label>
                    <input type="text" name="team1_name" class="form-control" value="{{ match.team1_name|default:'' }}" placeholder="e.g. Karwar Tigers" required>
                </div>
                <div class="form-group">
                    <label>Team 2</label>
                    <input type="text" name="team2_name" class="form-control" value="{{ match.team2_name|default:'' }}" placeholder="e.g. Ankola Warriors" required>
                </div>
            </div>
            <div class="form-row-3">
                <div class="form-group">
                    <label>Venue</label>
                    <input type="text" name="venue" class="form-control" value="{{ match.venue|default:'' }}" placeholder="e.g. Karwar Stadium">
                </div>
                <div class="form-group">
                    <label>Match Date & Time</label>
                    <input type="datetime-local" name="match_date" class="form-control" value="{{ match.match_date|date:'Y-m-d\TH:i'|default:'' }}" required>
                </div>
                <div class="form-group">
                    <label>Overs Per Side</label>
                    <input type="number" name="overs_limit" class="form-control" value="{{ match.overs_limit|default:20 }}" min="1">
                </div>
            </div>
            <div class="form-group">
                <label>Match Status</label>
                <select name="status" class="form-control">
                    <option value="upcoming" {% if match.status == 'upcoming' %}selected{% endif %}>Upcoming</option>
                    <option value="live" {% if match.status == 'live' %}selected{% endif %}>Live</option>
                    <option value="completed" {% if match.status == 'completed' %}selected{% endif %}>Completed</option>
                    <option value="cancelled" {% if match.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> {{ action }} Match</button>
        </form>
    </div>
</div>
{% endblock %}
