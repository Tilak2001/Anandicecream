{% extends 'base.html' %}

{% block title %}My Matrimony Profile{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <h1 class="mb-4">My Matrimony Profile</h1>
        
        {% if profile %}
        <div class="alert alert-success">
            <i class="fas fa-check-circle"></i> You have a matrimony profile.
            <a href="{% url 'matrimony:detail' profile.pk %}" class="alert-link">View Profile</a>
        </div>
        {% else %}
        <div class="alert alert-info">
            <i class="fas fa-info-circle"></i> You don't have a matrimony profile yet. Contact admin to create one.
        </div>
        {% endif %}
    </div>
</section>
{% endblock %}
