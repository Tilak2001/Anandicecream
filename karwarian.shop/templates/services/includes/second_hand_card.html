<article class="shm-card">
    <a href="{% url 'services:detail' item.slug %}" class="shm-card__link">
        <div class="shm-card__thumb">
            {% if item.main_image or item.image_url %}
            <img src="{{ item.get_image_url }}" alt="{{ item.title }}" loading="lazy">
            {% else %}
            <span class="shm-card__placeholder" data-i18n="shm.no_image">No image</span>
            {% endif %}
            {% if item.price_text %}
            <span class="shm-card__badge">{{ item.price_text }}</span>
            {% elif item.price %}
            <span class="shm-card__badge">₹{{ item.price }}</span>
            {% endif %}
        </div>
        <div class="shm-card__body">
            <h3 class="shm-card__title">{{ item.title }}</h3>
            <p class="shm-card__loc">{{ item.location }}</p>
        </div>
    </a>
</article>
